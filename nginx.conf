# Load balancer puro: round-robin entre as duas instâncias, sem nenhuma lógica.
worker_processes 1;

events {
    worker_connections 4096;
}

http {
    access_log off;
    error_log /dev/null crit;

    upstream api {
        server api1:8080;
        server api2:8080;
        keepalive 128;
    }

    server {
        listen 9999;

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # Se uma instância falhar/fechar a conexão, tenta a outra (mata 502 transitórios).
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_connect_timeout 1s;
        }
    }
}
