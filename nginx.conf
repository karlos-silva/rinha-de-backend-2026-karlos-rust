# Load balancer puro: round-robin entre as duas instâncias via unix socket
# (sem TCP loopback). Sem nenhuma lógica de detecção.
worker_processes auto;

events {
    worker_connections 4096;
}

http {
    access_log off;
    error_log /dev/null crit;

    upstream api {
        server unix:/tmp/sock/api1.sock;
        server unix:/tmp/sock/api2.sock;
        keepalive 256;
    }

    server {
        listen 9999;
        tcp_nodelay on;

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            # Se uma instância falhar, tenta a outra (robustez).
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }
    }
}
