# LB puro: round-robin TCP. Pinado nos cores 2,3.
worker_processes 2;
events { worker_connections 8192; }
http {
    access_log off;
    error_log /dev/null crit;
    upstream api {
        server api1:8080 max_fails=0;
        server api2:8080 max_fails=0;
        keepalive 256;
    }
    server {
        listen 9999;
        tcp_nodelay on;
        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
        }
    }
}
