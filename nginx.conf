# Load balancer puro: round-robin entre as instâncias via unix socket (tmpfs).
# Pinado nos cores 2,3. max_fails=0 para nunca marcar upstream como morto.
worker_processes 2;

events {
    worker_connections 8192;
}

http {
    access_log off;
    error_log /dev/null crit;

    upstream api {
        server unix:/sockets/api1.sock max_fails=0;
        server unix:/sockets/api2.sock max_fails=0;
        keepalive 256;
    }

    server {
        listen 9999;
        tcp_nodelay on;

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
        }
    }
}
