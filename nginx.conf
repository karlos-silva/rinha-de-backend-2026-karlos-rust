# Load balancer puro: round-robin TCP entre as duas instâncias. Sem lógica.
# tcp_nodelay + proxy_buffering off + keepalive no upstream para minimizar latência.
worker_processes auto;

events {
    worker_connections 4096;
}

http {
    access_log off;
    error_log /dev/null crit;

    upstream api {
        server api1:8080;
        server api2:8080;
        keepalive 256;
    }

    server {
        listen 9999;
        tcp_nodelay on;

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }
    }
}
