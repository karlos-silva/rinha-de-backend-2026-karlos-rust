# Submissão Rinha 2026. Total: 1.0 CPU (0.15+0.425+0.425), 350MB (30+160+160).
# TCP, sem cpuset (scheduler livre equilibra melhor que pinning errado).
services:
  nginx:
    image: nginx:1.27-alpine
    volumes: [./nginx.conf:/etc/nginx/nginx.conf:ro]
    ports: ["9999:9999"]
    depends_on: [api1, api2]
    deploy: {resources: {limits: {cpus: "0.15", memory: "30MB"}}}
  api1:
    image: ghcr.io/karlos-silva/rinha-fraud:latest
    hostname: api1
    environment: [PORT=8080, NPROBE=24]
    ulimits: {nofile: {soft: 65535, hard: 65535}}
    deploy: {resources: {limits: {cpus: "0.425", memory: "160M"}}}
  api2:
    image: ghcr.io/karlos-silva/rinha-fraud:latest
    hostname: api2
    environment: [PORT=8080, NPROBE=24]
    ulimits: {nofile: {soft: 65535, hard: 65535}}
    deploy: {resources: {limits: {cpus: "0.425", memory: "160M"}}}
