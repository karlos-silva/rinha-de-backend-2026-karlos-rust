# Submissão da Rinha de Backend 2026.
# Total: 1.0 CPU (0.45 + 0.45 + 0.10) e 350 MB (169 + 169 + 12).
# nginx (LB round-robin) fala com as APIs por unix socket num tmpfs compartilhado.
# cpuset pina cada serviço a cores dedicados (sem contenção/jitter).

volumes:
  sockets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=8m,uid=0,gid=0,mode=0777"

services:
  api1:
    image: ghcr.io/karlos-silva/rinha-fraud:latest
    hostname: api1
    cpuset: "0"
    environment:
      - UNIX_SOCKET=/sockets/api1.sock
      - NPROBE=24
    volumes:
      - sockets:/sockets
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      memlock: -1
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "169M"

  api2:
    image: ghcr.io/karlos-silva/rinha-fraud:latest
    hostname: api2
    cpuset: "1"
    environment:
      - UNIX_SOCKET=/sockets/api2.sock
      - NPROBE=24
    volumes:
      - sockets:/sockets
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      memlock: -1
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "169M"

  nginx:
    image: nginx:1.27-alpine
    cpuset: "2,3"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - sockets:/sockets
    ports:
      - "9999:9999"
    depends_on:
      - api1
      - api2
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "12M"
