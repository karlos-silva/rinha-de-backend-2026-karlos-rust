# Submissão da Rinha de Backend 2026.
# Total: 1.0 CPU (0.15 + 0.425 + 0.425) e 350 MB (30 + 160 + 160).
# nginx (LB round-robin) conversa com as APIs por unix socket num volume
# compartilhado — sem TCP loopback. As APIs ficam sem rede (network_mode none).

volumes:
  sock:

services:
  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - sock:/tmp/sock
    ports:
      - "9999:9999"
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: "30MB"

  api1:
    image: ghcr.io/karlos-silva/rinha-fraud:latest
    environment:
      - UNIX_SOCKET=/tmp/sock/api1.sock
      - NPROBE=24
      - THREADS=3
    volumes:
      - sock:/tmp/sock
    network_mode: "none"
    deploy:
      resources:
        limits:
          cpus: "0.425"
          memory: "160MB"

  api2:
    image: ghcr.io/karlos-silva/rinha-fraud:latest
    environment:
      - UNIX_SOCKET=/tmp/sock/api2.sock
      - NPROBE=24
      - THREADS=3
    volumes:
      - sock:/tmp/sock
    network_mode: "none"
    deploy:
      resources:
        limits:
          cpus: "0.425"
          memory: "160MB"
