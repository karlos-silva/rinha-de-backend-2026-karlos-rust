# Submissão Rinha 2026. Total: 1.0 CPU (0.45+0.45+0.10), 350MB (169+169+12).
# LB próprio (proxy TCP->unix, round-robin) no lugar do nginx. APIs em unix
# socket num tmpfs compartilhado. cpuset pina cada serviço a cores dedicados.

volumes:
  sockets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=8m,uid=0,gid=0,mode=0777"

services:
  api1:
    image: ghcr.io/karlos-silva/rinha-fraud:latest
    hostname: api1
    cpuset: "0"
    environment:
      - UNIX_SOCKET=/sockets/api1.sock
      - NPROBE=24
    volumes:
      - sockets:/sockets
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      memlock: -1
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "169M"

  api2:
    image: ghcr.io/karlos-silva/rinha-fraud:latest
    hostname: api2
    cpuset: "1"
    environment:
      - UNIX_SOCKET=/sockets/api2.sock
      - NPROBE=24
    volumes:
      - sockets:/sockets
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      memlock: -1
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "169M"

  lb:
    image: ghcr.io/karlos-silva/rinha-fraud:latest
    command: ["/app/lb"]
    cpuset: "2,3"
    environment:
      - PORT=9999
      - SOCKETS=/sockets/api1.sock,/sockets/api2.sock
    volumes:
      - sockets:/sockets
    ports:
      - "9999:9999"
    depends_on:
      - api1
      - api2
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "12M"
