# Submissão da Rinha de Backend 2026.
# Total: 1.0 CPU (0.15 + 0.425 + 0.425) e 350 MB (30 + 160 + 160).
# Rede bridge (padrão do compose). LB nginx round-robin -> api1, api2.

services:
  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "9999:9999"
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: "30MB"

  api1:
    image: ghcr.io/karlos-silva/rinha-fraud:latest
    environment:
      - PORT=8080
      - NPROBE=96
      - THREADS=3
    deploy:
      resources:
        limits:
          cpus: "0.425"
          memory: "160MB"

  api2:
    image: ghcr.io/karlos-silva/rinha-fraud:latest
    environment:
      - PORT=8080
      - NPROBE=96
      - THREADS=3
    deploy:
      resources:
        limits:
          cpus: "0.425"
          memory: "160MB"
